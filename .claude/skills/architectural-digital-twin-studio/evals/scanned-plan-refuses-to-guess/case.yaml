schema_version: "1.1"
name: scanned-plan-refuses-to-guess
expected_outcome: |
  The run notices that scan.pdf is a raster image with no vector geometry, says
  that millimetre accuracy cannot be guaranteed from it, and either stops and asks
  or produces only a model that is clearly labelled as estimated (never as
  measured or verified). It tells the user what source would allow a verified
  model (a vector PDF or the CAD file).
context:
  scaffold_script: place-files.sh
