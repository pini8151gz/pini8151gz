<!doctype html><html lang="he"><head><meta charset="utf-8"><link rel="stylesheet" href="fonts/fonts.css"><link rel="stylesheet" href="base.css"><style>
body{background:#121212;color:#fff;font-family:Heebo}
.haz{position:absolute;left:0;right:0;height:46px;background:repeating-linear-gradient(-45deg,#FFCC00 0 36px,#121212 36px 72px)}
.wrap{position:absolute;inset:0;padding:110px 76px}
.wm{font:400 120px/1 'Secular One';color:#FFCC00;display:flex;align-items:center;gap:10px}
.tag{font:700 30px/1 Heebo;color:#bdbdbd;margin-top:14px;letter-spacing:.5px}

.phonebox .lbl{font:900 40px/1.05 Heebo}
.phonebox .lbl span{display:inline;margin-right:18px;font-weight:700;font-size:28px;margin-top:6px}
.phone{font:900 132px/1 Heebo;letter-spacing:-4px;align-self:stretch;text-align:center;direction:ltr}
.foot{position:absolute;left:76px;right:76px;bottom:92px;display:flex;justify-content:space-between;font:500 25px/1.3 Heebo;color:#bdbdbd}
.foot b{color:#fff}
</style></head><body>
