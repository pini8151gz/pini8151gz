<!doctype html>
<html lang="he" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>שמחת בית השואבה המרכזית בישראל</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Suez+One&family=Heebo:wght@500;700;900&display=block"
      rel="stylesheet"
    />
    <script src="assets/gsap.min.js"></script>
    <style>
      :root {
        --bg: #05040b;
        --gold: linear-gradient(180deg, #fff6c9 0%, #ffd66b 28%, #d9981e 55%, #fff0a8 72%, #b77712 100%);
        --gold-solid: #f2c14e;
        --blue: #2f7bff;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--bg);
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--bg);
        font-family: Heebo, sans-serif;
        color: #fff;
        direction: rtl;
      }
      .clip {
        position: absolute;
        inset: 0;
      }
      .gold {
        background: var(--gold);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .display {
        font-family: "Suez One", Heebo, serif;
      }

      /* ---------- world ---------- */
      #ambient {
        position: absolute;
        inset: -120px;
        background: url("assets/poster.png") center / cover no-repeat;
        filter: blur(38px) saturate(1.3) brightness(0.45);
      }
      #beams {
        position: absolute;
        left: 0;
        right: 0;
        top: -200px;
        height: 1500px;
        mix-blend-mode: screen;
      }
      .beam {
        position: absolute;
        top: 0;
        width: 240px;
        height: 1700px;
        margin-left: -120px;
        transform-origin: 50% 0%;
        background: linear-gradient(to bottom, rgba(90, 160, 255, 0.85), rgba(60, 120, 255, 0.25) 45%, transparent 85%);
        clip-path: polygon(46% 0, 54% 0, 100% 100%, 0 100%);
        filter: blur(6px);
      }
      .beam.warm {
        background: linear-gradient(to bottom, rgba(255, 210, 120, 0.9), rgba(255, 170, 60, 0.25) 45%, transparent 85%);
      }
      #dust {
        position: absolute;
        inset: 0;
      }
      .mote {
        position: absolute;
        border-radius: 50%;
        background: radial-gradient(circle, #fff3c4 0%, #f2c14e 40%, transparent 70%);
      }
      #vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 50% 45%, transparent 40%, rgba(0, 0, 0, 0.85) 100%);
      }
      .bar {
        position: absolute;
        left: 0;
        right: 0;
        height: 90px;
        background: #000;
      }
      #bar-top {
        top: 0;
      }
      #bar-bot {
        bottom: 0;
      }
      #city {
        position: absolute;
        top: 110px;
        left: 40px;
        width: 250px;
        border-radius: 12px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
      }
      #flash {
        background: radial-gradient(circle at 50% 50%, #fff8dc, #ffd66b 40%, rgba(255, 180, 60, 0) 75%);
        opacity: 0;
        mix-blend-mode: screen;
      }

      /* ---------- scene A — crown ---------- */
      #halo {
        position: absolute;
        left: 540px;
        top: 760px;
        width: 1100px;
        height: 1100px;
        margin: -550px 0 0 -550px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 214, 107, 0.65), rgba(217, 152, 30, 0.2) 40%, transparent 68%);
      }
      #rays {
        position: absolute;
        left: 540px;
        top: 760px;
        width: 1600px;
        height: 1600px;
        margin: -800px 0 0 -800px;
        background: repeating-conic-gradient(rgba(255, 220, 140, 0.16) 0deg 4deg, transparent 4deg 15deg);
        -webkit-mask-image: radial-gradient(circle, #000 10%, transparent 60%);
        mask-image: radial-gradient(circle, #000 10%, transparent 60%);
      }
      #logo-wrap {
        position: absolute;
        left: 540px;
        top: 760px;
        width: 560px;
        height: 618px;
        margin: -309px 0 0 -280px;
        overflow: hidden;
        -webkit-mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 78%, transparent 100%);
        mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 78%, transparent 100%);
      }
      #logo {
        width: 100%;
        height: 100%;
        background: url("assets/logo.jpg") center / cover no-repeat;
      }
      .glint {
        position: absolute;
        top: -30%;
        left: 0;
        width: 34%;
        height: 160%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.75), transparent);
        transform: rotate(18deg) translateX(-200%);
        mix-blend-mode: overlay;
      }
      #a-lines {
        position: absolute;
        left: 60px;
        right: 60px;
        top: 1170px;
        text-align: center;
      }
      #a-lines div {
        font-size: 50px;
        font-weight: 900;
        line-height: 1.45;
        text-shadow: 0 4px 18px rgba(0, 0, 0, 0.9);
      }
      #a-lines span {
        display: inline-block;
      }

      /* ---------- scene B — title ---------- */
      #stage-band {
        position: absolute;
        left: -60px;
        right: -60px;
        top: 1060px;
        height: 520px;
        background: url("assets/stage.jpg") center / cover no-repeat;
        filter: blur(3px) brightness(1.15);
        -webkit-mask-image: linear-gradient(to bottom, transparent, #000 25%, #000 70%, transparent);
        mask-image: linear-gradient(to bottom, transparent, #000 25%, #000 70%, transparent);
      }
      #t-wrap {
        position: absolute;
        left: 0;
        right: 0;
        top: 470px;
        text-align: center;
        filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.9)) drop-shadow(0 0 30px rgba(255, 190, 70, 0.45));
      }
      #t1 {
        white-space: nowrap;
        font-size: 100px;
        line-height: 1.05;
      }
      #t2 {
        white-space: nowrap;
        font-size: 124px;
        line-height: 1.05;
        margin-top: 10px;
      }
      .ch {
        display: inline-block;
      }
      #t-shine-mask {
        position: absolute;
        left: 0;
        right: 0;
        top: 470px;
        height: 340px;
        overflow: hidden;
        mix-blend-mode: overlay;
      }
      #t-shine {
        position: absolute;
        top: -100px;
        left: 0;
        width: 260px;
        height: 800px;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.95), transparent);
        transform: rotate(20deg);
      }
      #b-sub {
        position: absolute;
        left: 0;
        right: 0;
        top: 820px;
        text-align: center;
        font-size: 46px;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: #ffe7a6;
        text-shadow: 0 4px 16px #000;
      }

      /* ---------- scene C — artists ---------- */
      #c-head {
        position: absolute;
        left: 0;
        right: 0;
        top: 200px;
        text-align: center;
        font-size: 92px;
      }
      #c-rule {
        position: absolute;
        left: 290px;
        right: 290px;
        top: 330px;
        height: 4px;
        background: linear-gradient(90deg, transparent, #ffd66b, transparent);
      }
      .artist {
        position: absolute;
        width: 480px;
        height: 610px;
      }
      .a-frame {
        position: absolute;
        left: 0;
        top: 0;
        width: 480px;
        height: 400px;
        border-radius: 28px;
        overflow: hidden;
        border: 3px solid rgba(255, 214, 107, 0.85);
        box-shadow:
          0 0 40px rgba(255, 190, 70, 0.35),
          0 20px 50px rgba(0, 0, 0, 0.7);
      }
      .a-img {
        position: absolute;
        inset: 0;
        background-size: cover;
        background-position: center top;
      }
      .a-frame .glint {
        mix-blend-mode: soft-light;
      }
      .a-name {
        position: absolute;
        left: 0;
        right: 0;
        top: 420px;
        text-align: center;
        font-size: 66px;
        line-height: 1.05;
        filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.9));
      }
      .a-note {
        font-family: Heebo, sans-serif;
        font-weight: 700;
        font-size: 36px;
        color: #ffe7a6;
      }
      #ar1 {
        right: 40px;
        top: 420px;
      }
      #ar2 {
        left: 40px;
        top: 420px;
      }
      #ar3 {
        right: 40px;
        top: 1080px;
      }
      #ar4 {
        left: 40px;
        top: 1080px;
      }

      /* ---------- scene D — details ---------- */
      #stadium {
        position: absolute;
        left: -80px;
        right: -80px;
        top: 150px;
        height: 900px;
        background: url("assets/stadium.jpg") center / cover no-repeat;
        -webkit-mask-image: linear-gradient(to bottom, transparent, #000 18%, #000 72%, transparent);
        mask-image: linear-gradient(to bottom, transparent, #000 18%, #000 72%, transparent);
      }
      #d-title {
        position: absolute;
        left: 0;
        right: 0;
        top: 250px;
        text-align: center;
        font-size: 84px;
        filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 1));
      }
      #panel {
        position: absolute;
        left: 50px;
        right: 50px;
        top: 960px;
        height: 620px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        gap: 22px;
      }
      .cell {
        border-radius: 30px;
        background: linear-gradient(160deg, rgba(40, 26, 8, 0.92), rgba(8, 6, 14, 0.94));
        border: 3px solid #d9a441;
        box-shadow:
          0 0 36px rgba(255, 190, 70, 0.35),
          inset 0 0 30px rgba(255, 200, 90, 0.12);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .cell .big {
        font-size: 104px;
        line-height: 1.05;
      }
      .cell .mid {
        font-size: 74px;
        line-height: 1.1;
      }
      .cell .small {
        font-size: 50px;
        font-weight: 900;
        color: #fff;
      }
      #d-foot {
        position: absolute;
        left: 0;
        right: 0;
        top: 1640px;
        text-align: center;
        font-size: 38px;
        font-weight: 700;
        color: #ffe7a6;
        letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1080" data-height="1920">
      <!-- world (always on) -->
      <div id="world" class="clip" data-start="0" data-duration="10" data-track-index="0">
        <div id="ambient"></div>
        <div id="beams"></div>
        <div id="dust"></div>
      </div>

      <!-- A — crown reveal -->
      <div id="sa" class="clip" data-start="0" data-duration="2.5" data-track-index="1">
        <div id="rays"></div>
        <div id="halo"></div>
        <div id="logo-wrap"><div id="logo"></div><div class="glint" id="logo-glint"></div></div>
        <div id="a-lines">
          <div id="al1"><span>המעמד</span> <span>האדיר</span> <span>של</span> <span>קירוב</span> <span>וחיזוק</span> <span>לבבות</span></div>
          <div id="al2"><span>בעיר</span> <span>פתח</span> <span>תקווה</span> <span>וקבלת</span> <span>עול</span> <span>מלכות</span> <span>שמים</span></div>
        </div>
      </div>

      <!-- B — main title -->
      <div id="sb" class="clip" data-start="2.3" data-duration="2.6" data-track-index="2">
        <div id="stage-band"></div>
        <div id="t-wrap" class="display">
          <div id="t1"></div>
          <div id="t2"></div>
        </div>
        <div id="t-shine-mask"><div id="t-shine"></div></div>
        <div id="b-sub">✦ מישקולץ · מלכות התורה ✦</div>
      </div>

      <!-- C — artists -->
      <div id="sc" class="clip" data-start="4.75" data-duration="2.85" data-track-index="3">
        <div id="c-head" class="display gold">בהשתתפות</div>
        <div id="c-rule"></div>
        <div class="artist" id="ar1">
          <div class="a-frame"><div class="a-img" style="background-image: url('assets/s4.jpg')"></div><div class="glint"></div></div>
          <div class="a-name display gold">מרדכי שפירא<br /><span class="a-note">ארה״ב</span></div>
        </div>
        <div class="artist" id="ar2">
          <div class="a-frame"><div class="a-img" style="background-image: url('assets/s3.jpg')"></div><div class="glint"></div></div>
          <div class="a-name display gold">חיים ישראל</div>
        </div>
        <div class="artist" id="ar3">
          <div class="a-frame"><div class="a-img" style="background-image: url('assets/s2.jpg')"></div><div class="glint"></div></div>
          <div class="a-name display gold">יואלי דיקמן<br /><span class="a-note">ותזמורתו</span></div>
        </div>
        <div class="artist" id="ar4">
          <div class="a-frame"><div class="a-img" style="background-image: url('assets/s1.jpg')"></div><div class="glint"></div></div>
          <div class="a-name display gold">שלמה כהן</div>
        </div>
      </div>

      <!-- D — when & where -->
      <div id="sd" class="clip" data-start="7.45" data-duration="2.55" data-track-index="4">
        <div id="stadium"></div>
        <div id="d-title" class="display gold">אצטדיון פתח תקווה</div>
        <div id="panel">
          <div class="cell"><div class="big display gold">28.9</div><div class="small">יום שני</div></div>
          <div class="cell"><div class="small">ערבית</div><div class="big display gold">19:15</div></div>
          <div class="cell"><div class="small">אצטדיון</div><div class="mid display gold">פתח תקווה</div></div>
          <div class="cell"><div class="small">הכניסה</div><div class="mid display gold">חופשית</div></div>
        </div>
        <div id="d-foot">האירוע בפיקוח ובהכוונת בד״צ מישקולץ</div>
      </div>

      <!-- overlays -->
      <div id="fx" class="clip" data-start="0" data-duration="10" data-track-index="5">
        <div id="vignette"></div>
        <img id="city" src="assets/city.jpg" alt="עיריית פתח תקווה" />
        <div class="bar" id="bar-top"></div>
        <div class="bar" id="bar-bot"></div>
      </div>
      <div id="flash" class="clip" data-start="0" data-duration="10" data-track-index="6"></div>
    </div>

    <script>
      function mulberry32(a) {
        return function () {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const rnd = mulberry32(2809);

      // light beams
      const beamsEl = document.getElementById("beams");
      const beams = [];
      for (let i = 0; i < 9; i++) {
        const b = document.createElement("div");
        b.className = "beam" + (i % 3 === 1 ? " warm" : "");
        b.style.left = 60 + i * 120 + "px";
        beamsEl.appendChild(b);
        beams.push(b);
      }
      // gold dust
      const dustEl = document.getElementById("dust");
      const motes = [];
      for (let i = 0; i < 70; i++) {
        const m = document.createElement("div");
        m.className = "mote";
        const s = 6 + rnd() * 16;
        m.style.cssText = `left:${rnd() * 1080}px;top:${300 + rnd() * 1700}px;width:${s}px;height:${s}px;opacity:${0.35 + rnd() * 0.6}`;
        m.dataset.rise = 500 + rnd() * 900;
        m.dataset.sway = (rnd() - 0.5) * 160;
        dustEl.appendChild(m);
        motes.push(m);
      }
      // split titles into letters (Hebrew has no joining, so per-letter spans are safe)
      function split(el, text) {
        return [...text].map((c) => {
          const s = document.createElement("span");
          s.className = "ch gold";
          s.textContent = c === " " ? " " : c;
          el.appendChild(s);
          return s;
        });
      }
      const t1c = split(document.getElementById("t1"), "שמחת בית השואבה");
      const t2c = split(document.getElementById("t2"), "המרכזית בישראל");

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;

      // ---------- world ----------
      tl.fromTo("#ambient", { scale: 1.25, opacity: 0 }, { scale: 1.05, opacity: 1, duration: 10, ease: "sine.out" }, 0);
      beams.forEach((b, i) => {
        const base = (i - 4) * 7;
        tl.fromTo(b, { rotation: base - 14, opacity: 0 }, { rotation: base + 14, opacity: 1, duration: 3.2, ease: "sine.inOut" }, 0.1 + i * 0.03);
        tl.to(b, { rotation: base - 12, duration: 3.3, ease: "sine.inOut" }, 3.3 + i * 0.03);
        tl.to(b, { rotation: base + 8, duration: 3.3, ease: "sine.inOut" }, 6.6 + i * 0.03);
      });
      motes.forEach((m) => {
        tl.fromTo(m, { y: 0, x: 0 }, { y: -m.dataset.rise, x: +m.dataset.sway, duration: 10, ease: "none" }, 0);
      });
      tl.fromTo(".bar", { scaleY: 2.2 }, { scaleY: 1, duration: 1.2, ease: "power3.out" }, 0);
      tl.fromTo("#city", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 0.6);

      // ---------- A: crown (0 – 2.5) ----------
      tl.fromTo("#halo", { scale: 0.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 1.2, ease: "expo.out" }, 0.25);
      tl.fromTo("#rays", { rotation: 0, opacity: 0, scale: 0.6 }, { rotation: 40, opacity: 1, scale: 1, duration: 2.5, ease: "power1.out" }, 0.2);
      tl.fromTo(
        "#logo-wrap",
        { scale: 0.55, opacity: 0, filter: "blur(24px) brightness(2)" },
        { scale: 1, opacity: 1, filter: "blur(0px) brightness(1)", duration: 1.0, ease: "expo.out" },
        0.3,
      );
      tl.to("#logo-wrap", { scale: 1.06, duration: 1.2, ease: "sine.inOut" }, 1.3);
      tl.fromTo("#logo-glint", { xPercent: -200 }, { xPercent: 420, duration: 0.8, ease: "power2.inOut" }, 1.0);
      tl.fromTo("#al1 span", { opacity: 0, y: 30, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.4, stagger: 0.06, ease: "power2.out" }, 0.9);
      tl.fromTo("#al2 span", { opacity: 0, y: 30, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.4, stagger: 0.06, ease: "power2.out" }, 1.25);
      tl.to("#sa", { scale: 1.6, opacity: 0, filter: "blur(14px)", duration: 0.4, ease: "power3.in" }, 2.1);
      tl.fromTo("#flash", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power1.in" }, 2.2);
      tl.to("#flash", { opacity: 0, duration: 0.5, ease: "power2.out" }, 2.35);

      // ---------- B: title (2.3 – 4.9) ----------
      tl.fromTo("#stage-band", { scale: 1.3, opacity: 0 }, { scale: 1.05, opacity: 1, duration: 2.6, ease: "power2.out" }, 2.3);
      tl.fromTo(t1c, { opacity: 0, y: -120, rotationX: -90, transformPerspective: 800 }, { opacity: 1, y: 0, rotationX: 0, duration: 0.55, stagger: 0.035, ease: "back.out(1.8)" }, 2.4);
      tl.fromTo(t2c, { opacity: 0, scale: 3.2, filter: "blur(16px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.45, stagger: 0.03, ease: "expo.out" }, 3.0);
      // impact shake as the second line lands
      [3.42, 3.47, 3.52, 3.57].forEach((t, i) => tl.to("#t-wrap", { x: i % 2 ? -10 : 10, y: i % 2 ? 6 : -6, duration: 0.05, ease: "none" }, t));
      tl.to("#t-wrap", { x: 0, y: 0, duration: 0.08 }, 3.62);
      tl.to("#flash", { opacity: 0.55, duration: 0.08 }, 3.42);
      tl.to("#flash", { opacity: 0, duration: 0.4 }, 3.5);
      tl.fromTo("#t-shine", { x: -400 }, { x: 1400, duration: 0.9, ease: "power2.inOut" }, 3.75);
      tl.fromTo("#t-wrap", { scale: 1 }, { scale: 1.06, duration: 2.0, ease: "sine.out" }, 2.9);
      tl.fromTo("#b-sub", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 3.8);
      tl.to("#sb", { opacity: 0, y: -160, duration: 0.4, ease: "power3.in" }, 4.5);

      // ---------- C: artists (4.75 – 7.6) ----------
      tl.fromTo("#c-head", { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.5, ease: "expo.out" }, 4.75);
      tl.fromTo("#c-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, 4.9);
      ["#ar1", "#ar2", "#ar3", "#ar4"].forEach((q, i) => {
        const t = 4.9 + i * 0.28;
        const dir = i % 2 ? -1 : 1;
        tl.fromTo(
          q + " .a-frame",
          { opacity: 0, x: 260 * dir, rotationY: 50 * dir, transformPerspective: 1400 },
          { opacity: 1, x: 0, rotationY: 0, duration: 0.7, ease: "expo.out" },
          t,
        );
        tl.fromTo(q + " .a-img", { scale: 1.3 }, { scale: 1.0, duration: 2.6, ease: "power2.out" }, t);
        tl.fromTo(q + " .glint", { xPercent: -200 }, { xPercent: 420, duration: 0.7, ease: "power2.inOut" }, t + 0.45);
        tl.fromTo(q + " .a-name", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: "back.out(2)" }, t + 0.3);
      });
      tl.fromTo("#sc", { scale: 1 }, { scale: 1.04, duration: 2.45, ease: "none" }, 4.75);
      tl.to("#sc", { opacity: 0, scale: 0.9, filter: "blur(10px)", duration: 0.4, ease: "power3.in" }, 7.2);
