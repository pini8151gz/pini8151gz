      // 3.6: the answer

        { opacity: 1, filter: "blur(0px)", duration: 0.18, stagger: 0.45, ease: "power4.out" }, 3.6);

      // 5.0: bolt strikes, battery charges in brand yellow

      tl.fromTo(st, { v: 2 }, { v: 100, duration: 1.2, ease: "power2.inOut", immediateRender: false }, 5.1);
      tl.to("#pct", { opacity: 0, filter: "blur(8px)", duration: 0.18, ease: "power2.in" }, 4.95);
