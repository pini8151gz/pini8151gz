  <div id="root" data-composition-id="build" data-width="1920" data-height="1080" data-layout-allow-overflow data-layout-allow-overlap>

    <div id="cam" data-layout-ignore>
      <img id="ghost" src="assets/ghost.jpg" alt="" />

  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      // Frame poster point (cx, cy) at the frame centre at scale s.
      const shot = (cx, cy, s) => ({ x: 960 - cx * s, y: 540 - cy * s, scale: s });
      const FIT = 1000 / 1601;

      // 0 – 2.3: dark open, the ghost of the design surfaces while the camera glides over the top
      tl.set("#cam", shot(545, 320, 1.8), 0);
      tl.fromTo("#ghost", { opacity: 0.35 }, { opacity: 1, duration: 1.6, ease: "power2.inOut" }, 0);
      tl.to("#cam", { ...shot(780, 320, 1.8), duration: 2.3, ease: "power2.inOut" }, 0);

      // 2.3: the photo develops with a camera flash; camera settles on the three
      tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.85, duration: 0.06, ease: "none" }, 2.25);
      tl.to("#flash", { opacity: 0, duration: 0.45, ease: "power2.out" }, 2.31);
      tl.fromTo(
        "#l-people",
        { opacity: 0, scale: 1.12, filter: "blur(18px) brightness(1.8)" },
        { opacity: 1, scale: 1, filter: "blur(0px) brightness(1)", duration: 1.0, ease: "expo.out" },
        2.28,
      );
      tl.to("#cam", { ...shot(665, 360, 1.15), duration: 1.3, ease: "power3.inOut" }, 2.3);
      tl.to("#cam", { ...shot(665, 400, 1.1), duration: 1.4, ease: "power1.inOut" }, 3.6);

      // 5.0: tilt down to the title; it wipes in right-to-left, the Hebrew reading direction
      tl.to("#cam", { ...shot(665, 790, 1.05), duration: 0.8, ease: "power3.inOut" }, 5.0);
      tl.fromTo(
        "#l-title",
        { clipPath: "inset(0% 0% 0% 100%)", x: 60, filter: "blur(10px)" },
        { clipPath: "inset(0% 0% 0% 0%)", x: 0, filter: "blur(0px)", duration: 0.8, ease: "expo.out" },
        5.4,
      );
      tl.fromTo(
        "#l-sub",
        { opacity: 0, scale: 0.4, rotation: -8 },
        { opacity: 1, scale: 1, rotation: 0, duration: 0.6, ease: "back.out(1.6)" },
        6.3,
      );

      // 7.0: down to the tour dates; cards drop in right-to-left, row by row
      tl.to("#cam", { ...shot(700, 1260, 0.98), duration: 1.0, ease: "power3.inOut" }, 7.0);
      tl.to("#cam", { ...shot(630, 1270, 0.98), duration: 2.6, ease: "power1.inOut" }, 8.0);
      ["#l-c1", "#l-c2", "#l-c3", "#l-c4", "#l-c5", "#l-c6", "#l-c7"].forEach((id, i) => {
        const at = 7.6 + i * 0.16 + (i >= 4 ? 0.25 : 0);
        tl.fromTo(
          id,
          { opacity: 0, y: -90, scale: 1.15, filter: "blur(10px)" },
          { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.6, ease: "expo.out" },
          at,
        );
      });
      tl.fromTo(
        "#l-stamp",
        { opacity: 0, scale: 2.2, rotation: -260 },
        { opacity: 1, scale: 1, rotation: 0, duration: 0.9, ease: "expo.out" },
        9.4,
      );

      // 10.6: pull back to the whole poster, bars open, backdrop glows in
      tl.to("#cam", { ...shot(660, 800.5, FIT), duration: 1.8, ease: "power3.inOut" }, 10.6);
      tl.to("#bar-top", { y: -132, duration: 1.0, ease: "power2.inOut" }, 10.9);
      tl.to("#bar-bot", { y: 132, duration: 1.0, ease: "power2.inOut" }, 10.9);
      tl.fromTo("#backdrop", { opacity: 0 }, { opacity: 1, duration: 1.4, ease: "power2.inOut" }, 10.9);

      // 12.5: rack focus, the finished poster resolves; one sheen crosses it
      tl.fromTo("#sharp", { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "power2.inOut" }, 12.5);
      tl.fromTo("#sheen", { x: -500, rotation: 18 }, { x: 1700, rotation: 18, duration: 1.1, ease: "power2.inOut" }, 13.3);

      window.__timelines["build"] = tl;
    })();
  </script>
