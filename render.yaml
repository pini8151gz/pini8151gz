services:
  - type: web
    name: harabanit-bot
    runtime: docker
    plan: free
    dockerfilePath: ./harabanit-bot/Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ALLOWED_IDS
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
